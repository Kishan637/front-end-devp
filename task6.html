<!DOCTYPE html>
<html>

<head>
            <title>Website Clone</title>

            <style>
                        body {
                                    margin: 0;
                                    font-family: Arial;
                        }

                        header {
                                    background: black;
                                    color: white;
                                    display: flex;
                                    justify-content: space-between;
                                    padding: 15px 30px;
                        }

                        nav a {
                                    color: white;
                                    margin: 0 10px;
                                    text-decoration: none;
                        }

                        .hero {
                                    height: 80vh;
                                    background: lightblue;
                                    display: flex;
                                    justify-content: center;
                                    align-items: center;
                                    flex-direction: column;
                        }

                        .hero h1 {
                                    font-size: 40px;
                        }

                        .hero button {
                                    padding: 10px 20px;
                                    font-size: 16px;
                                    background: blue;
                                    color: white;
                                    border: none;
                                    cursor: pointer;
                        }

                        footer {
                                    background: black;
                                    color: white;
                                    text-align: center;
                                    padding: 10px;
                        }
            </style>
</head>

<body>

            <header>
                        <h2>MySite</h2>
                        <nav>
                                    <a href="#">Home</a>
                                    <a href="#">About</a>
                                    <a href="#">Contact</a>
                        </nav>
            </header>

            <div class="hero">
                        <h1>Welcome to My Website</h1>
                        <p>Build your future with web development</p>
                        <button onclick="showMessage()">Get Started</button>
            </div>

            <footer>
                        <p>© 2026 My Website</p>
            </footer>

            <script>
                        function showMessage() {
                                    alert("Welcome! You clicked the button.");
                        }
            </script>

</body>

</html>
