<!DOCTYPE html>
<html>

<head>
            <title>Responsive Layout</title>

            <style>
                        * {
                                    margin: 0;
                                    padding: 0;
                                    box-sizing: border-box;
                        }

                        body {
                                    font-family: Arial;
                        }

                        header {
                                    background: black;
                                    color: white;
                                    padding: 15px;
                                    text-align: center;
                        }

                        .container {
                                    display: grid;
                                    grid-template-columns: 1fr 3fr;
                                    height: 80vh;
                        }

                        .sidebar {
                                    background: lightgray;
                                    padding: 20px;
                        }

                        .main {
                                    background: white;
                                    padding: 20px;
                        }

                        footer {
                                    background: black;
                                    color: white;
                                    text-align: center;
                                    padding: 10px;
                        }

                        /* Responsive (Mobile) */
                        @media (max-width: 768px) {
                                    .container {
                                                grid-template-columns: 1fr;
                                    }
                        }
            </style>
</head>

<body>

            <header>
                        <h1>My Website</h1>
            </header>

            <div class="container">
                        <div class="sidebar">
                                    <h2>Sidebar</h2>
                                    <p>Menu links</p>
                        </div>

                        <div class="main">
                                    <h2>Main Content</h2>
                                    <p>This is main area.</p>
                        </div>
            </div>

            <footer>
                        <p>Footer Section</p>
            </footer>

</body>

</html>
