<!DOCTYPE html>
<html>

<head>
            <title>Product Card</title>
            <style>
                        body {
                                    font-family: Arial;
                                    display: flex;
                                    justify-content: center;
                                    align-items: center;
                                    height: 100vh;
                                    background-color: #f2f2f2;
                        }

                        .card {
                                    background: white;
                                    width: 250px;
                                    padding: 15px;
                                    border-radius: 10px;
                                    text-align: center;
                                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                        }

                        .card img {
                                    width: 100%;
                                    border-radius: 10px;
                        }

                        .product-name {
                                    font-size: 18px;
                                    margin: 10px 0;
                        }

                        .price {
                                    color: green;
                                    font-size: 16px;
                                    margin-bottom: 10px;
                        }

                        .btn {
                                    background: blue;
                                    color: white;
                                    padding: 10px;
                                    border: none;
                                    border-radius: 5px;
                                    cursor: pointer;
                        }

                        .btn:hover {
                                    background: darkblue;
                        }
            </style>
</head>

<body>

            <div class="card">
                        <img src="https://via.placeholder.com/250" alt="Product">
                        <div class="product-name">Cool Shoes</div>
                        <div class="price">₹999</div>
                        <button class="btn">Add to Cart</button>
            </div>

</body>

</html>
